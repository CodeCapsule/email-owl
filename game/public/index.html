<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emberwood Online</title>
<style>
  :root{--wood:#5b3f2b;--wood2:#7a5a40;--cream:#fff2d6;--gold:#ffd36e;--ink:#2f1f14}
  html,body{margin:0;height:100%;background:#2b1d14;color:var(--cream);font:14px/1.35 "Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#e9c98acc,#3a2616f2);z-index:5}
  #login>div{background:var(--wood2);border:4px solid var(--ink);box-shadow:0 0 0 4px var(--wood),0 12px 30px #0008;border-radius:18px;padding:30px 38px;text-align:center;max-width:340px}
  #login h1{margin:0 0 4px;color:var(--gold);font-size:30px;text-shadow:0 3px 0 var(--ink)}
  #login p{margin:4px 0 18px;color:var(--cream)}
  input{font:inherit;padding:9px 12px;border-radius:10px;border:2px solid var(--ink);background:#fff8e8;color:var(--ink);outline:none}
  input:focus{border-color:#e59a3a}
  #name{width:150px}
  button{font:inherit;font-weight:bold;padding:9px 18px;border-radius:10px;border:2px solid var(--ink);background:#7bc86c;color:#1d3a17;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  #err{color:#ffb3a8;min-height:18px;margin-top:10px}
  #chat{position:fixed;left:12px;bottom:12px;width:min(430px,60vw);display:none}
  #log{height:128px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;background:#3a2616b8;border:2px solid var(--ink);padding:7px 10px;border-radius:12px;text-shadow:1px 1px #000a}
  #log .sys{color:var(--gold)}
  #msg{width:100%;box-sizing:border-box;margin-top:6px}
  #help{position:fixed;right:12px;bottom:12px;background:#3a2616b8;border:2px solid var(--ink);padding:6px 12px;border-radius:12px;font-size:12px;color:var(--cream);display:none;max-width:42vw}
  #bagbtn{position:fixed;left:12px;top:116px;display:none}
  #inv{position:fixed;right:12px;top:60px;width:292px;background:var(--wood2);border:4px solid var(--ink);box-shadow:0 0 0 4px var(--wood),0 10px 26px #0008;border-radius:16px;padding:12px 14px;z-index:4;user-select:none}
  #inv[hidden]{display:none}
  #inv h3{margin:0 0 8px;color:var(--gold);display:flex;justify-content:space-between;align-items:center;text-shadow:0 2px 0 var(--ink)}
  #inv h3 button{padding:2px 9px;background:#e57a6a;color:#fff}
  #eq,#grid{display:grid;gap:6px}
  #eq{grid-template-columns:repeat(4,1fr);margin-bottom:6px}
  #grid{grid-template-columns:repeat(5,1fr);margin-top:8px}
  .slot{position:relative;aspect-ratio:1;border:2px solid #4a3322;border-radius:9px;background:#4d3523;display:flex;align-items:center;justify-content:center;font-size:23px}
  .slot.full{cursor:pointer;background:#6a4c34}
  .slot.full:hover,.slot.sel{background:#8a6544;outline:2px solid var(--gold)}
  .slot span{position:absolute;right:3px;bottom:0;font-size:11px;font-weight:bold;color:#fff;text-shadow:1px 1px #000,-1px -1px #000,1px -1px #000,-1px 1px #000}
  #stats{font-size:12px;color:var(--gold);text-align:center}
  #detail{margin-top:10px;min-height:62px;background:#4d3523;border-radius:9px;padding:8px 10px;font-size:12.5px}
  #detail .btns{margin-top:6px;display:flex;gap:6px}
  #detail button,#sellall{padding:4px 10px;font-size:12px;box-shadow:0 2px 0 var(--ink)}
  #sellall{width:100%;margin-top:8px;background:#f2c14e;color:#4a2f10}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="login"><div>
  <h1>Emberwood Online</h1>
  <p>A tiny 2D multiplayer adventure.</p>
  <input id="name" maxlength="14" placeholder="Hero name" autofocus>
  <button id="go">Play</button>
  <div id="err"></div>
</div></div>
<div id="chat"><div id="log"></div><input id="msg" maxlength="120" placeholder="Press Enter to chat"></div>
<button id="bagbtn">🎒 Bag (I)</button>
<div id="inv" hidden>
  <h3>🎒 Backpack <button id="closeinv">✕</button></h3>
  <div id="eq"></div><div id="stats"></div><div id="grid"></div><div id="detail"></div>
  <button id="sellall">Sell all loot junk (in town)</button>
</div>
<div id="help">WASD/Arrows move · Click ground to walk · Click monster to attack · Space attack nearest · Q potion · I bag · Enter chat</div>
<script src="game.js"></script>
</body>
</html>
